[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scigantic-ucsc"
version = "0.3.0"
description = "Read UCSC Genome Browser conservation scores, multiz alignments, TOGA gene annotations and assembly lists straight from UCSC's public S3 bucket, without downloading the files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT-0" }
authors = [{ name = "Scigantic" }]
keywords = ["ucsc", "genome-browser", "comparative-genomics", "phylop", "multiz", "bigwig"]
classifiers = [
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "numpy>=1.24",
  "pyBigWig>=0.3.22",
]

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.10"]

[project.urls]
Homepage = "https://scigantic.com"
Repository = "https://github.com/Scigantic/scigantic-ucsc"
Issues = "https://github.com/Scigantic/scigantic-ucsc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scigantic_ucsc = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: reads the real UCSC bucket; run with SCIGANTIC_UCSC_LIVE=1"]

[tool.mypy]
strict = true

# pyBigWig ships no type stubs; nothing to fix on our side.
[[tool.mypy.overrides]]
module = "pyBigWig.*"
ignore_missing_imports = true
